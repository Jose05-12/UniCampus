<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="Portátil con código en un escritorio">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e4dc"/>
      <stop offset="1" stop-color="#cfc6b8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="url(#fondo)"/>
  <!-- ventana -->
  <rect x="20" y="20" width="120" height="150" rx="4" fill="#f7f5f0" opacity=".8"/>
  <path d="M80 20 V170 M20 95 H140" stroke="#ddd6ca" stroke-width="4"/>
  <!-- planta -->
  <path d="M60 250 C 30 200, 40 160, 70 150 C 62 190, 70 220, 78 250 Z" fill="#5d9c4c"/>
  <path d="M76 250 C 80 190, 100 160, 128 162 C 110 190, 98 222, 92 250 Z" fill="#4c8a3d"/>
  <path d="M70 250 C 50 216, 22 214, 14 226 C 36 228, 52 240, 62 252 Z" fill="#6aae57"/>
  <rect x="52" y="246" width="50" height="46" rx="6" fill="#efe9df"/>
  <!-- escritorio -->
  <rect x="0" y="330" width="320" height="70" fill="#8a6d4f"/>
  <rect x="0" y="326" width="320" height="8" fill="#a3825f"/>
  <!-- portátil: pantalla -->
  <g transform="rotate(-4 200 250)">
    <rect x="98" y="150" width="210" height="150" rx="8" fill="#1f2230"/>
    <rect x="108" y="160" width="190" height="130" rx="3" fill="#0f1420"/>
    <g stroke-width="5" stroke-linecap="round">
      <path d="M120 176 H160" stroke="#7aa2f7"/>
      <path d="M168 176 H210" stroke="#e0af68"/>
      <path d="M132 190 H190" stroke="#9ece6a"/>
      <path d="M132 204 H170" stroke="#bb9af7"/>
      <path d="M178 204 H240" stroke="#7dcfff"/>
      <path d="M144 218 H200" stroke="#9ece6a"/>
      <path d="M144 232 H260" stroke="#e0af68"/>
      <path d="M132 246 H180" stroke="#f7768e"/>
      <path d="M120 260 H150" stroke="#7aa2f7"/>
      <path d="M132 274 H230" stroke="#9ece6a"/>
    </g>
  </g>
  <!-- portátil: base -->
  <path d="M84 322 L300 306 L318 322 L100 340 Z" fill="#3a3e4f"/>
  <path d="M120 318 L280 306" stroke="#575c70" stroke-width="6" stroke-dasharray="8 4"/>
  <!-- taza -->
  <rect x="20" y="300" width="34" height="34" rx="5" fill="#f4f1ea"/>
  <path d="M54 308 C 66 308, 66 326, 54 326" stroke="#f4f1ea" stroke-width="5" fill="none"/>
</svg>
